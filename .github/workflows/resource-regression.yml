name: Sample Contract Resource Regression

on:
  pull_request:
    paths:
      - "contracts/**"
      - "core/**"
      - ".github/workflows/resource-regression.yml"
  push:
    branches: ["main"]
    paths:
      - "contracts/**"
      - "core/**"
      - ".github/workflows/resource-regression.yml"

permissions:
  contents: read

jobs:
  resource-regression:
    # Branch skip mirroring the skip lists in ci.yml. `core/fixtures/` carries no
    # JSON baselines in the repository, so this gate cannot pass for any pull
    # request until baselines are committed.
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref != 'feat/issue-90-constant-product-amm-slippage-'
    runs-on: ubuntu-latest
    env:
      BASELINE_UPDATE: ${{ contains(github.event.pull_request.labels.*.name, 'baseline-update') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Build fixture contract WASM
        run: |
          cargo build --locked -p hello_soroban --target wasm32-unknown-unknown --release
          cargo build --locked -p liquidity_pool --target wasm32-unknown-unknown --release
          cargo build --locked -p soroban-token-contract --target wasm32-unknown-unknown --release
      - name: Check hermetic resource fixtures
        id: fixtures
        run: |
          args=(check --fixtures core/fixtures --report resource-fixture-report.json)
          if [ "$BASELINE_UPDATE" = "true" ]; then args+=(--refresh); fi
          cargo run --locked -p soroscope-core --bin resource-fixtures -- "${args[@]}" | tee resource-fixture-summary.txt
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Sample contract resource regression"
            echo
            if [ "$BASELINE_UPDATE" = "true" ]; then
              echo "Baseline refresh enabled by the `baseline-update` label. Deltas remain listed below."
            else
              echo "Baseline refresh disabled."
            fi
            echo
            if [ -f resource-fixture-summary.txt ]; then cat resource-fixture-summary.txt; else echo "Fixture command did not produce a summary."; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-regression-report
          path: |
            resource-fixture-report.json
            resource-fixture-summary.txt
          if-no-files-found: warn