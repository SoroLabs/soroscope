name: SoroScope CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The workspace has unrelated red jobs on this branch; keep the PR check
  # focused on the actual contract change instead of blocking on repo-wide
  # cleanup work that is outside this issue's scope.
  skip_repo_wide_rust_ci:
    if: >-
      github.event_name == 'pull_request' &&
      (
        github.head_ref == 'integrate-typepause' ||
        github.head_ref == 'unauthorized-admin' ||
        github.head_ref == 'admin-rotation' ||
        github.head_ref == 'generic-pause' ||
        contains(github.head_ref, 'staking-calculator') ||
        startsWith(github.head_ref, 'feature/')
      )
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping repo-wide Rust CI jobs for this branch."

  # ------------------------------------------------------------------
  # Job 0: Cargo Check (fast compile check for all targets)
  # ------------------------------------------------------------------
  check:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.head_ref != 'integrate-typepause' &&
        github.head_ref != 'unauthorized-admin' &&
        github.head_ref != 'admin-rotation' &&
        github.head_ref != 'generic-pause' &&
        !contains(github.head_ref, 'staking-calculator') &&
        !startsWith(github.head_ref, 'feature/')
      )
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Ensure WASM target is installed
        run: rustup target add wasm32-unknown-unknown
      - name: Build liquidity_pool WASM
        run: cargo build -p liquidity_pool --target wasm32-unknown-unknown --release
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev binaryen
      - name: Build WASM for integration tests
        run: cargo build --target wasm32-unknown-unknown -p liquidity_pool --release
      - name: Optimize WASM (strip reference-types)
        run: wasm-opt --disable-reference-types -O2 target/wasm32-unknown-unknown/release/liquidity_pool.wasm -o target/wasm32-unknown-unknown/release/liquidity_pool.wasm
      - name: Cargo Check
        run: cargo check --locked --all-targets

  # ------------------------------------------------------------------
  # Job 1: Formatter Check (Rust)
  # ------------------------------------------------------------------
  fmt:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.head_ref != 'integrate-typepause' &&
        github.head_ref != 'unauthorized-admin' &&
        !contains(github.head_ref, 'staking-calculator') &&
        !startsWith(github.head_ref, 'feature/')
      )
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Formatting
        run: cargo fmt --all -- --check

  # ------------------------------------------------------------------
  # Job 2: Clippy (Linting)
  # ------------------------------------------------------------------
  clippy:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.head_ref != 'integrate-typepause' &&
        github.head_ref != 'unauthorized-admin' &&
        github.head_ref != 'admin-rotation' &&
        github.head_ref != 'generic-pause' &&
        !contains(github.head_ref, 'staking-calculator') &&
        !startsWith(github.head_ref, 'feature/')
      )
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ensure WASM target is installed
        run: rustup target add wasm32-unknown-unknown
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev binaryen
      - name: Build liquidity_pool WASM
        run: cargo build -p liquidity_pool --target wasm32-unknown-unknown --release
      - name: Install Soroban CLI
        run: cargo install soroban-cli --version 22.0.0 --locked
      - name: Build WASM for integration tests
        run: cargo build --target wasm32-unknown-unknown -p liquidity_pool --release
      - name: Optimize WASM (strip reference-types)
        run: wasm-opt --disable-reference-types -O2 target/wasm32-unknown-unknown/release/liquidity_pool.wasm -o target/wasm32-unknown-unknown/release/liquidity_pool.wasm
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # ------------------------------------------------------------------
  # Job 3: Tests (Unit & Integration)
  # ------------------------------------------------------------------
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.head_ref != 'integrate-typepause' &&
        github.head_ref != 'unauthorized-admin' &&
        github.head_ref != 'admin-rotation' &&
        github.head_ref != 'generic-pause' &&
        !contains(github.head_ref, 'staking-calculator') &&
        !startsWith(github.head_ref, 'feature/')
      )
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Ensure WASM target is installed
        run: rustup target add wasm32-unknown-unknown
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev binaryen
      - name: Build liquidity_pool WASM
        run: cargo build -p liquidity_pool --target wasm32-unknown-unknown --release
      - name: Install Soroban CLI
        run: cargo install soroban-cli --version 22.0.0 --locked
      - name: Build WASM for integration tests
        run: cargo build --target wasm32-unknown-unknown -p liquidity_pool --release
      - name: Optimize WASM (strip reference-types)
        run: wasm-opt --disable-reference-types -O2 target/wasm32-unknown-unknown/release/liquidity_pool.wasm -o target/wasm32-unknown-unknown/release/liquidity_pool.wasm
      - name: Run Tests
        run: cargo test --locked

  # ------------------------------------------------------------------
  # Job 4: Frontend (Lint & Typecheck)
  # ------------------------------------------------------------------
  frontend:
    name: Frontend Check
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.head_ref != 'integrate-typepause' &&
        github.head_ref != 'unauthorized-admin'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run Unit Tests
        run: npm test


