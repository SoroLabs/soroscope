[package]
name = "soroscope-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "soroscope_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
soroban-env-host = { version = "22", features = ["testutils"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.29", features = ["bundled"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
thiserror = "1.0"
dotenvy = "0.15"
config = "0.14"
axum = { version = "0.7", features = ["multipart", "ws"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.27"
opentelemetry_sdk = "0.27"
tracing-opentelemetry = "0.28"
prometheus = "0.14"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "set-header", "compression-full"] }
base64 = "0.22"
hex = "0.4"
stellar-strkey = "0.0.9"
jsonwebtoken = "9"
ed25519-dalek = "=2.1.1"
rand = "0.8"
moka = { version = "0.12", features = ["future", "sync"] }
sled = "0.34"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "uuid", "chrono", "migrate"] }
redis = { version = "0.25", features = ["tokio-comp"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rsa = "0.9"
wasm-encoder = { version = "0.240", features = ["wasmparser"] }
wasmparser = "0.240"
rayon = "1.8"
# Used by the host resource alarm monitor (issue #592) to sample CPU
# and RAM utilisation for the local process. Default features include
# everything we need: `system`, `process`, and the CPU usage diff.
sysinfo = "0.32"
# gRPC event streaming (Issue #583)
#
# The `tls` feature pulls in rustls so the gRPC server can terminate TLS and
# present a proper certificate chain (Issue #918).
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
tokio-stream = { version = "0.1", features = ["sync"] }
# Enables precise PEM parsing so the whole certificate chain (leaf + any
# intermediate CAs) is loaded and presented by the Tonic server, instead of
# truncating to a single certificate (Issue #918).
rustls-pemfile = "2"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
proptest = "1.4.0"
tower = { version = "0.4", features = ["util"] }
criterion = { version = "0.5", features = ["html_reports"] }
tikv-jemalloc-ctl = { version = "0.5", optional = false }
tikv-jemallocator = { version = "0.5", optional = false }
# Generates throwaway CA/server/client certificates for the gRPC TLS
# integration test (Issue #918).
rcgen = "0.13"
# Low-level TLS client used by the integration test to drive a real TLS
# handshake against the Tonic gRPC server, proving the certificate chain
# loading fix (Issue #918).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = "0.26"

[[bench]]
name = "merkle_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false
