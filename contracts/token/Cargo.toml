[package]
name = "soroban-token-contract"
description = "Soroban Token Contract with emergency pause and multi-sig controls"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
emergency_guard = { path = "../emergency_guard", default-features = false }
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
emergency_guard = { path = "../emergency_guard", default-features = false, features = ["contract"] }
